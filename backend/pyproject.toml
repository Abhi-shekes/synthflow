[project]
name = "synthflow-backend"
version = "0.1.0"
description = "SynthFlow backend — FastAPI core, rules/simulation engine, plugin manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "faker>=30.0",
    "exrex>=0.11",
    "openpyxl>=3.1",
    "qrcode[pil]>=7.4",
    "prometheus-client>=0.21",
    "sqlglot>=25.0",
    # Encryption at rest for stored connection secrets (app.core.secrets).
    # Core rather than an extra on purpose: if it were optional, the default
    # install would keep storing passwords in plaintext, which is the gap
    # this closes.
    "cryptography>=43.0",
]

# Optional broker clients — this is what "modular installation" means in
# practice: a Kafka-only deployment installs `.[kafka]` and never pulls
# aiomqtt, and vice versa. app.services.install detects at runtime which
# of these are present and the API/UI degrade cleanly for the rest, so
# the code still imports and every other feature still works either way.
[project.scripts]
synthflow = "app.cli:main"

[project.optional-dependencies]
kafka = ["aiokafka>=0.11"]
mqtt = ["aiomqtt>=2.1"]
# Everything, for a batteries-included install or local development.
all = ["aiokafka>=0.11", "aiomqtt>=2.1"]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
