[project]
name = "synthflow-backend"
version = "0.1.0"
description = "SynthFlow backend — FastAPI core, rules/simulation engine, plugin manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "faker>=30.0",
    "exrex>=0.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
