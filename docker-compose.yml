# Every published port below binds to 127.0.0.1 by default (see
# BIND_ADDRESS), and every credential below reads from an environment
# variable with a dev-only fallback. `synthflow init` generates real
# random values for both the SECRET_KEY and every datastore password
# an install actually starts — see backend/app/cli.py. Overriding
# BIND_ADDRESS to 0.0.0.0 to expose a service beyond localhost is a
# deliberate, individual choice; there is no "make it all public" switch
# on purpose.
services:
  postgres:
    container_name: synthflow-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synthflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthflow}
      POSTGRES_DB: synthflow
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5433:5432"
    volumes:
      - synthflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    container_name: synthflow-backend
    build:
      context: ./backend
      args:
        # Set by `synthflow init` in .env — controls which optional
        # broker clients get installed into the image. Defaults to empty
        # (core only), so an install that never selected Kafka or MQTT
        # doesn't carry their dependencies.
        SYNTHFLOW_EXTRAS: ${SYNTHFLOW_EXTRAS:-}
    environment:
      DATABASE_URL: postgresql+psycopg://synthflow:${POSTGRES_PASSWORD:-synthflow}@postgres:5432/synthflow
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:3000"]'}
      # Single sign-on. Empty by default, which turns SSO off and leaves the
      # password login as the only way in — the right default for a local
      # install. Filled in here from .env when the `sso` profile is running.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8001:8000"
    volumes:
      # The source is bind-mounted and uvicorn runs with --reload (see the
      # Dockerfile's CMD), so editing a .py file on the host restarts the
      # app in place. A rebuild is only needed when *dependencies* change:
      # pyproject.toml, or SYNTHFLOW_EXTRAS, both of which are baked at
      # build time.
      - ./backend:/app
      # Keeps the image's installed packages from being hidden if a .venv
      # ever appears on the host. Dependencies live in the image, not in a
      # directory the mount could shadow.
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # On every optional service's network, not just `app`: it's the one
    # thing that talks to all of them (Kafka producer, MQTT publisher,
    # Mongo/MySQL push, MinIO upload, Dex token exchange, Prometheus
    # scrape target). That's what makes the segmentation below meaningful
    # rather than cosmetic — e.g. mosquitto and postgres share no network
    # with each other, only each with backend.
    networks: [app, mqtt, kafka, mysql, mongo, rabbitmq, s3, monitoring, sso]
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    container_name: synthflow-frontend
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      # `next dev` watches through inotify, which works over a bind mount on
      # Linux. On filesystems where it does not propagate — Docker Desktop's
      # osxfs/gRPC-FUSE, NFS, some Windows setups — set WATCHPACK_POLLING=true
      # in .env to fall back to polling. Off by default because polling wakes
      # the CPU on every interval whether anything changed or not.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      CHOKIDAR_USEPOLLING: ${WATCHPACK_POLLING:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      # Source is bind-mounted and the container runs `next dev`, so a saved
      # .tsx file is live in the browser in about a second — no rebuild. A
      # rebuild is needed only when package.json changes.
      - ./frontend:/app
      # Anonymous volumes, so the container keeps its own. `node_modules` is
      # installed inside the image from the lockfile and may contain
      # platform-specific binaries the host's copy does not; `.next` is build
      # output that must not be shared with a host-side `next build`.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 512m

  # Optional — only for exercising KafkaOutput (see
  # app.services.stream_producers). Not started by `docker compose up`;
  # bring it up explicitly with `docker compose --profile kafka up`.
  redpanda:
    container_name: synthflow-redpanda
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - redpanda:9092
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9092:9092"
    profiles: ["kafka"]
    networks: [kafka]
    deploy:
      resources:
        limits:
          memory: 1g

  # Optional — only for exercising MQTTOutput. Not started by `docker
  # compose up`; bring it up explicitly with `docker compose --profile mqtt up`.
  mosquitto:
    container_name: synthflow-mosquitto
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:1883:1883"
    profiles: ["mqtt"]
    networks: [mqtt]
    deploy:
      resources:
        limits:
          memory: 128m

  # Optional push *targets* — these exist so you can try a MySQL or MongoDB
  # connection against a real server instead of trusting that the driver
  # works. They are targets SynthFlow writes into, not part of SynthFlow:
  # nothing here stores application state, and neither is needed unless you
  # are pushing to that kind of database.
  #   docker compose --profile mysql up
  #   docker compose --profile mongo up
  mysql:
    container_name: synthflow-mysql
    image: mysql:8.4
    # Native AIO off: InnoDB grabs a pool of kernel aio contexts at startup
    # and fails hard with io_setup() EAGAIN when the host's fs.aio-max-nr is
    # already spoken for by other containers. That is easy to hit on a
    # developer machine running several databases, and this is a throwaway
    # push target where the I/O cost of turning it off is irrelevant.
    command: ["--innodb-use-native-aio=0"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-synthflow}
      MYSQL_DATABASE: synthflow_target
      MYSQL_USER: synthflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-synthflow}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["mysql"]
    networks: [mysql]
    deploy:
      resources:
        limits:
          memory: 512m

  mongo:
    container_name: synthflow-mongo
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: synthflow
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-synthflow}
      MONGO_INITDB_DATABASE: synthflow_target
    ports:
      # Non-default host ports for both of these (3307, 27018): they are
      # throwaway push targets, and a developer with a real MySQL or
      # MongoDB already running locally should not have to stop it to try
      # SynthFlow. Inside the compose network they still use 3306/27017.
      - "${BIND_ADDRESS:-127.0.0.1}:27117:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["mongo"]
    networks: [mongo]
    deploy:
      resources:
        limits:
          memory: 512m

  # A RabbitMQ broker to publish into. Management UI on 15673 so you can
  # watch messages arrive.
  #   docker compose --profile rabbitmq up
  rabbitmq:
    container_name: synthflow-rabbitmq
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: synthflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-synthflow}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5673:5672"
      - "${BIND_ADDRESS:-127.0.0.1}:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    profiles: ["rabbitmq"]
    networks: [rabbitmq]
    deploy:
      resources:
        limits:
          memory: 512m

  # An S3-compatible server to push job artifacts into, so the object
  # storage connector can be exercised without an AWS account. MinIO speaks
  # the same API as S3, R2, Spaces and B2 — which is the whole reason the
  # connector targets the S3 API with a configurable endpoint rather than
  # AWS specifically.
  #   docker compose --profile s3 up
  minio:
    container_name: synthflow-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: synthflow
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-synthflow123}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9100:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["s3"]
    networks: [s3]
    deploy:
      resources:
        limits:
          memory: 512m

  # Optional monitoring stack — Prometheus scrapes the backend's /metrics,
  # Grafana renders the bundled dashboard, Loki + promtail collect
  # container logs. Not started by `docker compose up`; bring the whole
  # set up with `docker compose --profile monitoring up`.
  prometheus:
    container_name: synthflow-prometheus
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    depends_on:
      - backend
    profiles: ["monitoring"]
    networks: [monitoring]
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    container_name: synthflow-grafana
    image: grafana/grafana:11.5.1
    environment:
      # Anonymous visitors can view the bundled dashboard with no login
      # step, but only as Viewer — not Admin. Editing dashboards, adding
      # data sources, or installing plugins requires signing in with
      # GF_SECURITY_ADMIN_PASSWORD below, which `synthflow init` generates
      # a real value for (see backend/app/cli.py). Anonymous Admin was the
      # previous default; it turned "reachable" into "fully owned" for
      # anyone who could hit this port, which is a worse trade than one
      # login prompt for the rare dashboard edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3000"
    depends_on:
      - prometheus
    profiles: ["monitoring"]
    networks: [monitoring]
    deploy:
      resources:
        limits:
          memory: 512m

  loki:
    container_name: synthflow-loki
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3100:3100"
    profiles: ["monitoring"]
    networks: [monitoring]
    deploy:
      resources:
        limits:
          memory: 512m

  # A minimal, read-only proxy in front of the Docker socket, so promtail
  # never touches it directly. CONTAINERS=1 is the only surface enabled —
  # container listing plus the per-container logs endpoint, which is all
  # Docker service discovery + log shipping need. Everything else (image
  # management, exec, volumes, starting/stopping containers, the daemon's
  # own info) stays off. The alternative — mounting the raw socket into
  # promtail, a general-purpose log shipper — hands anything that
  # compromises that container the full Docker API, including every other
  # container's environment variables (SECRET_KEY, database passwords)
  # visible via `docker inspect`.
  docker-socket-proxy:
    container_name: synthflow-docker-socket-proxy
    image: tecnativa/docker-socket-proxy:0.2
    environment:
      CONTAINERS: 1
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles: ["monitoring"]
    networks: [monitoring]
    deploy:
      resources:
        limits:
          memory: 64m

  promtail:
    container_name: synthflow-promtail
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    depends_on:
      - loki
      - docker-socket-proxy
    profiles: ["monitoring"]
    networks: [monitoring]
    deploy:
      resources:
        limits:
          memory: 128m

  # A real OpenID Connect provider, so single sign-on is verified against
  # something that implements the spec rather than a mock that agrees with
  # us. Behind the `sso` profile: it is a development dependency of one
  # feature, not part of the stack.
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: synthflow-dex
    profiles: ["sso"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      # Non-default on the host, like every other test target here, so it
      # cannot collide with something already running.
      - "${BIND_ADDRESS:-127.0.0.1}:5556:5556"
    networks: [sso]
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  synthflow_postgres_data:

# One network per optional service, plus `app` for the always-on core —
# not one flat default network for everything. Without this, a compromised
# low-value container (mosquitto, say) has direct network reach to
# postgres and every other unrelated service just by being on the same
# compose project. `backend` is the one service that legitimately talks to
# all of them (see its own networks: list above), so it's the only thing
# every optional network has in common — mosquitto and postgres, for
# example, share no network with each other.
networks:
  app:
  mqtt:
  kafka:
  mysql:
  mongo:
  rabbitmq:
  s3:
  monitoring:
  sso:
