services:
  postgres:
    container_name: synthflow-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synthflow
      POSTGRES_PASSWORD: synthflow
      POSTGRES_DB: synthflow
    ports:
      - "5433:5432"
    volumes:
      - synthflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: synthflow-backend
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://synthflow:synthflow@postgres:5432/synthflow
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: synthflow-frontend
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # Optional — only for exercising KafkaOutput (see
  # app.services.stream_producers). Not started by `docker compose up`;
  # bring it up explicitly with `docker compose --profile kafka up`.
  redpanda:
    container_name: synthflow-redpanda
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - redpanda:9092
    ports:
      - "9092:9092"
    profiles: ["kafka"]

  # Optional — only for exercising MQTTOutput. Not started by `docker
  # compose up`; bring it up explicitly with `docker compose --profile mqtt up`.
  mosquitto:
    container_name: synthflow-mosquitto
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    profiles: ["mqtt"]

volumes:
  synthflow_postgres_data:
