services:
  postgres:
    container_name: synthflow-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synthflow
      POSTGRES_PASSWORD: synthflow
      POSTGRES_DB: synthflow
    ports:
      - "5433:5432"
    volumes:
      - synthflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: synthflow-backend
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://synthflow:synthflow@postgres:5432/synthflow
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: synthflow-frontend
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  synthflow_postgres_data:
