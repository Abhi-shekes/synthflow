# Provisioned so Grafana comes up already wired to both backends — no
# manual "add a datasource" step before the bundled dashboard works.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: synthflow-prometheus

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: synthflow-loki
