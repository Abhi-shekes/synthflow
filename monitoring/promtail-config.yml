# Dev-only promtail config for the optional `monitoring` docker-compose
# profile. Discovers running containers through the Docker socket and
# ships their stdout/stderr to Loki, labelled by container name — so the
# Grafana dashboard's log panel can filter to {container="synthflow-backend"}
# without anything having to be configured per service.
#
# NOTE: this requires mounting /var/run/docker.sock, which gives the
# promtail container broad control over the Docker daemon. That's why the
# whole monitoring stack is behind an opt-in profile rather than part of
# the default `docker compose up` — see docker-compose.yml.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Docker reports names as "/synthflow-backend"; strip the slash so
      # the label matches what the dashboard queries.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
