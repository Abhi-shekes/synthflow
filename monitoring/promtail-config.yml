# Dev-only promtail config for the optional `monitoring` docker-compose
# profile. Discovers running containers and ships their stdout/stderr to
# Loki, labelled by container name — so the Grafana dashboard's log panel
# can filter to {container="synthflow-backend"} without anything having to
# be configured per service.
#
# Talks to `docker-socket-proxy`, not the Docker socket directly — see
# that service in docker-compose.yml for why. It's still the whole
# monitoring stack's reason for being behind an opt-in profile rather than
# part of the default `docker compose up`.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 5s
    relabel_configs:
      # Docker reports names as "/synthflow-backend"; strip the slash so
      # the label matches what the dashboard queries.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
