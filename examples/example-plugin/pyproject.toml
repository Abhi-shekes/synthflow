[project]
name = "synthflow-example-plugin"
version = "0.1.0"
description = "Example SynthFlow plugin — a template for writing your own generator, rule-function, and output plugins"
requires-python = ">=3.11"

# This is the whole mechanism: SynthFlow's backend discovers every
# installed package that declares an entry under "synthflow.generators"
# (see app/services/plugins.py in the main repo) and offers each one as a
# preset a STRING field can use. No SynthFlow code change, no
# registration step beyond `pip install` into the same environment as the
# backend and a process restart.
[project.entry-points."synthflow.generators"]
license_plate = "synthflow_example_plugin.generators:license_plate"

# Same discovery mechanism, different group: an entry here becomes
# callable by name from inside any rule condition, event-trigger
# condition, or formula field (app/services/expressions.py).
[project.entry-points."synthflow.rule_functions"]
is_business_day = "synthflow_example_plugin.rule_functions:is_business_day"

# Same mechanism again: an entry here becomes a plugin_name a PluginOutput
# can use, receiving (config: dict, rows: list[dict]) once per tick —
# SynthFlow owns pacing/batch loading, the plugin only owns delivery.
[project.entry-points."synthflow.outputs"]
write_jsonl = "synthflow_example_plugin.output_plugins:write_jsonl"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
