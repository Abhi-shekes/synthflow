# Dev-only config for the optional `mqtt` docker-compose profile (see
# app.services.stream_producers / MQTTOutput) — anonymous, unencrypted
# access on the default MQTT port, the same "throwaway push target to try
# a connector against" role mysql/mongo/rabbitmq/minio play elsewhere in
# docker-compose.yml. It is not part of SynthFlow's own deployment, and
# its host port is bound to 127.0.0.1 by default there (BIND_ADDRESS) —
# that binding is what actually keeps this reachable only from the host
# it's running on.
#
# If this ever needs to be reachable beyond that — a real MQTT broker
# other services publish to, not just a local connector test — add
# `password_file` (built with `mosquitto_passwd`) and per-topic ACLs, and
# add a `listener 8883` with `cafile`/`certfile`/`keyfile` for TLS. None of
# that belongs in a config whose only job today is "exists long enough to
# prove MQTTOutput can publish to something real."
listener 1883
allow_anonymous true
